spring:
  application:
    name: release-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/deployments
    username: release-manager-user
    password: release-manager-password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org:
      springframework:
        jdbc: DEBUG